<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Apexo</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; max-width: 40rem; }
    #transcript { min-height: 8rem; white-space: pre-wrap; border: 1px solid #ccc; padding: 1rem; }
    button { margin-right: 0.5rem; margin-bottom: 0.5rem; }
    #download { font-size: 1rem; padding: 0.45rem 0.8rem; }
    #gemma-file { font-family: ui-monospace, monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@litert-lm/core": "/assets/apexo/litert/dist/index.js",
        "@litertjs/wasm-utils": "/assets/apexo/wasm-utils/dist/index.js"
      }
    }
  </script>
</head>
<body>
  <h1>实时转写</h1>
  <div id="transcript" aria-label="transcript"></div>
  <p>
    <button id="mic" type="button">开始录音</button>
    <button id="stop" type="button">结束</button>
    <button id="feed-test-audio" type="button">测试音频识别</button>
    <button id="summarize-new" type="button">阶段摘要</button>
    <button id="summarize" type="button">总结</button>
    <button id="listen" type="button">回听刚才这一段</button>
  </p>
  <p id="gemma-offer">
    <button id="download" type="button">下载 Gemma 4 E2B</button>
    <span id="gemma-file">gemma-4-E2B-it-gpu.litertlm</span>
  </p>
  <p id="gemma-progress">总结要用这份网页版权重，大约 2 GB。</p>
  <p id="engine"></p>
  <p id="browser-asr-offer">
    <label>
      <input id="use-browser-asr" type="checkbox">
      启用浏览器自带识别（注意：浏览器可能把音频发送到云端在线服务）
    </label>
  </p>
  <p id="status"></p>

  <hr style="margin: 2rem 0; border: none; border-top: 1px solid #ddd;">
  <h2>纯文本总结测试（场景 2）</h2>
  <p>无需麦克风与 ASR，直接对外部文本进行结构化摘要：</p>
  <textarea id="external-input" rows="4" style="width: 100%; box-sizing: border-box; padding: 0.5rem;" placeholder="输入外部文本测试纯文本摘要（例如：会议决定原定周五发布，经评估取消周五计划，最终决定改到下周三下午发布...）"></textarea>
  <p>
    <button id="summarize-external" type="button">摘要外部文本</button>
  </p>
  <div id="external-summary" style="white-space: pre-wrap; border: 1px dashed #aaa; padding: 0.8rem; min-height: 3rem; background: #fafafa;"></div>

  <script type="module">
    import { createSession, probeAsrFile } from "/sdk/index.js";

    const transcript = document.querySelector("#transcript");
    const status = document.querySelector("#status");
    const engineLabel = document.querySelector("#engine");
    const browserAsrCheckbox = document.querySelector("#use-browser-asr");
    const gemmaProgress = document.querySelector("#gemma-progress");
    const downloadButton = document.querySelector("#download");
    const gemmaWebFile = "gemma-4-E2B-it-gpu.litertlm";
    const session = createSession({
      summaryModelPath: gemmaWebFile,
      asrModelPath: "asr-model",
      sherpaUrl: "/assets/apexo/sherpa/",
      litertWasmUrl: "/assets/apexo/litert/",
      webSummary: true,
      onChange: () => paint(), // events from the recognizer worker arrive after pushPcm has returned
    });

    let loadErrorReason = "";
    try {
      await session.loadRecognizer();
    } catch (err) {
      // A present model that fails to load stays failed. Recording does not silently switch to cloud ASR.
      loadErrorReason = String(err?.message || err || "unknown error");
    }

    function updateEngineNotice() {
      if (session.recognizerState === "live") {
        engineLabel.textContent = "转写引擎：本机 sherpa-onnx，音频不离开浏览器。";
      } else if (browserAsrCheckbox.checked) {
        engineLabel.textContent = "转写引擎：已手动启用浏览器自带识别，浏览器可能把音频发到云端在线服务。";
      } else if (session.recognizerState === "failed") {
        engineLabel.textContent = `转写引擎：本机识别器加载失败（${loadErrorReason}）。默认不启用浏览器云端识别；如需临时使用请勾选下方选项。`;
      } else {
        engineLabel.textContent = "转写引擎：未检测到本地模型（请把 encoder.onnx、decoder.onnx、joiner.onnx、tokens.txt 放进 asr-model 目录）。默认不启用浏览器云端识别；如需临时使用请勾选下方选项。";
      }
    }
    updateEngineNotice();
    (async () => {
      try {
        if (await probeAsrFile(gemmaWebFile)) {
          downloadButton.textContent = "Gemma 4 E2B 已就绪";
          gemmaProgress.textContent = "检测到本地 Gemma 4 E2B 模型已就绪，可直接生成阶段摘要或总结。";
        }
      } catch {}
    })();
    browserAsrCheckbox.addEventListener("change", () => {
      updateEngineNotice();
      if (recording) {
        if (browserAsrCheckbox.checked) startRecognition();
        else stopRecognition();
      }
    });

    let audioContext;
    let workletModule = false;
    let media;
    let source;
    let worklet;
    let mute;
    let recognition;
    let recording = false;
    let segmentSamples = [];
    let lastSegment = new Float32Array(0);
    let lastRate = 16000;
    let segmentStarted = 0;
    let committed = "";
    let recognitionBlocked = false;

    function paint() {
      transcript.textContent = session.displayText;
    }

    function clock() {
      return Math.max(0, Date.now() - segmentStarted);
    }

    function concat(chunks) {
      let total = 0;
      for (const chunk of chunks) total += chunk.length;
      const out = new Float32Array(total);
      let offset = 0;
      for (const chunk of chunks) {
        out.set(chunk, offset);
        offset += chunk.length;
      }
      return out;
    }

    function segmentAudio() {
      return recording ? concat(segmentSamples) : lastSegment;
    }

    function stopRecognition() {
      const current = recognition;
      recognition = null;
      if (!current) return;
      current.onresult = null;
      current.onend = null;
      current.onerror = null;
      try {
        current.stop();
      } catch {
        // Already stopped.
      }
    }

    function startRecognition() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech || session.recognizerState === "live" || !browserAsrCheckbox.checked) return;
      recognitionBlocked = false;
      committed = "";
      const next = new Speech();
      recognition = next;
      next.lang = "zh-CN";
      next.continuous = true;
      next.interimResults = true;
      next.onresult = (event) => {
        if (!recording || recognition !== next) return;
        let finals = "";
        let interim = "";
        for (let i = 0; i < event.results.length; i += 1) {
          const text = event.results[i][0].transcript;
          if (event.results[i].isFinal) finals += text;
          else interim += text;
        }
        const now = clock();
        if (finals && finals !== committed) {
          const extra = finals.startsWith(committed) ? finals.slice(committed.length).trim() : finals.trim();
          committed = finals;
          if (extra) session.pushAsrEvent({ isFinal: 1, text: extra, startMs: now, endMs: now });
        }
        session.pushAsrEvent({ isFinal: 0, text: interim.trim(), startMs: now, endMs: now });
        paint();
      };
      next.onerror = (event) => {
        if (event.error === "not-allowed" || event.error === "service-not-allowed" || event.error === "network") {
          recognitionBlocked = true;
          status.textContent = "浏览器没能把声音转成文字";
        }
      };
      next.onend = () => {
        if (!recording || recognitionBlocked || recognition !== next) return;
        committed = "";
        try {
          next.start();
        } catch {
          // A second start can overlap the first. The next onend retries.
        }
      };
      next.start();
    }

    async function startRecording() {
      if (recording) return;
      session.reset();
      paint();
      media = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: { ideal: 1 },
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
        },
      });
      if (!audioContext || audioContext.state === "closed") {
        try {
          audioContext = new AudioContext({ sampleRate: 16000 });
        } catch {
          audioContext = new AudioContext();
        }
      }
      if (audioContext.state === "suspended") await audioContext.resume();
      if (!workletModule) {
        await audioContext.audioWorklet.addModule("/worklet.js");
        workletModule = true;
      }
      source = audioContext.createMediaStreamSource(media);
      worklet = new AudioWorkletNode(audioContext, "apexo-capture");
      mute = audioContext.createGain();
      mute.gain.value = 0;
      segmentSamples = [];
      segmentStarted = Date.now();
      lastRate = audioContext.sampleRate;
      recording = true;
      let acceptingWorkletTail = true;
      worklet.port.onmessage = (event) => {
        if (!acceptingWorkletTail) return;
        const samples = event.data instanceof Float32Array ? event.data : new Float32Array(event.data);
        segmentSamples.push(new Float32Array(samples));
        if (session.recognizerState === "live") {
          session.pushPcm(samples, audioContext.sampleRate);
          paint();
        }
      };
      worklet.__stopTail = () => {
        acceptingWorkletTail = false;
      };
      source.connect(worklet);
      worklet.connect(mute);
      mute.connect(audioContext.destination);
      if (session.recognizerState !== "live" && browserAsrCheckbox.checked) {
        startRecognition();
      }
      status.textContent = "录音中";
    }

    async function finishRecording() {
      const wasRecording = recording;
      recording = false;
      stopRecognition();
      if (media) media.getTracks().forEach((track) => track.stop());
      media = null;
      if (source) source.disconnect();
      // Let any already-queued AudioWorklet message arrive before closing the port.
      await new Promise((resolve) => setTimeout(resolve, 0));
      if (worklet) {
        if (typeof worklet.__stopTail === "function") worklet.__stopTail();
        worklet.disconnect();
      }
      if (mute) mute.disconnect();
      source = null;
      worklet = null;
      mute = null;
      if (wasRecording) {
        lastSegment = concat(segmentSamples);
        segmentSamples = [];
      }
      try {
        await session.endSegment();
      } catch {
        // Recognizer failed to finish; preserve existing transcript.
      }
      paint();
      status.textContent = "这一段已结束";
    }

    document.querySelector("#mic").addEventListener("click", () => {
      startRecording().catch(() => {
        recording = false;
        // Do not leave the microphone open when a later step (audio context, worklet) failed.
        if (media) media.getTracks().forEach((track) => track.stop());
        media = null;
        status.textContent = "麦克风没有打开";
      });
    });

    document.querySelector("#stop").addEventListener("click", async () => {
      if (!recording && !lastSegment.length) {
        status.textContent = "还没有开始录音";
        return;
      }
      await finishRecording();
    });

    document.querySelector("#listen").addEventListener("click", () => {
      const samples = segmentAudio();
      if (!audioContext || !samples.length) {
        status.textContent = "还没有可回听的一段";
        return;
      }
      const buffer = audioContext.createBuffer(1, samples.length, lastRate);
      buffer.copyToChannel(new Float32Array(samples), 0);
      const player = audioContext.createBufferSource();
      player.buffer = buffer;
      player.connect(audioContext.destination);
      player.start();
      status.textContent = "正在回放刚才这一段";
    });

    document.querySelector("#summarize-new").addEventListener("click", async () => {
      await session.drain();
      const spoken = session.fullTranscript;
      if (!spoken) {
        status.textContent = "还没有可总结的已定稿文字";
        return;
      }
      status.textContent = "正在生成阶段摘要";
      try {
        const stageSummary = await session.summarizeNew();
        const currentSpoken = session.fullTranscript || spoken;
        transcript.textContent = stageSummary
          ? `${currentSpoken}\n\n阶段摘要\n${stageSummary}`
          : currentSpoken;
        status.textContent = recording ? "录音中（阶段摘要已更新）" : "阶段摘要完成";
      } catch (err) {
        const currentSpoken = session.fullTranscript || spoken;
        transcript.textContent = currentSpoken;
        if (err?.code === -3) {
          status.textContent = "这一段的文字在上面。网页版 Gemma 权重不在，还不能另写总结。";
        } else if (err?.code === -6) {
          status.textContent = "已有总结正在运行";
        } else {
          status.textContent = `阶段摘要没有跑起来：${session.lastError || err?.message || ""}`;
        }
      }
    });

    document.querySelector("#summarize").addEventListener("click", async () => {
      if (recording) await finishRecording();
      await session.drain();
      const spoken = session.fullTranscript;
      if (!spoken) {
        status.textContent = "还没有可总结的文字";
        return;
      }
      status.textContent = "正在总结";
      try {
        const summary = await session.summarize();
        transcript.textContent = `${spoken}\n\n总结\n${summary}`;
        status.textContent = session.gemmaResident ? "Gemma 仍驻留" : "总结完成";
      } catch (err) {
        transcript.textContent = spoken;
        if (err?.code === -3) {
          status.textContent = "这一段的文字在上面。网页版 Gemma 权重不在，还不能另写总结。";
        } else if (err?.code === -6) {
          status.textContent = "已有总结正在运行";
        } else {
          status.textContent = `总结没有跑起来：${session.lastError || err?.message || ""}`;
        }
      }
    });

    let downloading = false;
    downloadButton.addEventListener("click", async () => {
      if (downloading) return;
      downloading = true;
      downloadButton.disabled = true;
      gemmaProgress.textContent = "正在下载 Gemma 4 E2B…";
      try {
        const response = await fetch(`/download/${gemmaWebFile}`);
        if (!response.ok || !response.body) throw new Error("download failed");
        const total = Number(response.headers.get("content-length")) || 0;
        const reader = response.body.getReader();
        const chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.byteLength;
          const amount = total ? `${Math.floor((received / total) * 100)}%` : `${Math.floor(received / 1000000)} MB`;
          gemmaProgress.textContent = `正在下载 Gemma 4 E2B ${amount}`;
        }
        if (total && received !== total) throw new Error("short download");
        session.setSummaryModel(chunks);
        downloadButton.textContent = "Gemma 4 E2B 已下载";
        gemmaProgress.textContent = "Gemma 4 E2B 已下载，可以点总结。";
      } catch {
        downloading = false;
        downloadButton.disabled = false;
        gemmaProgress.textContent = "Gemma 4 E2B 没有下载下来。";
      }
    });

    document.querySelector("#feed-test-audio").addEventListener("click", async () => {
      if (recording) return;
      session.reset();
      paint();
      status.textContent = "正在加载测试音频...";
      try {
        const res = await fetch("/test.wav");
        if (!res.ok) throw new Error("test.wav not found");
        const arrayBuf = await res.arrayBuffer();
        if (!audioContext || audioContext.state === "closed") {
          audioContext = new AudioContext({ sampleRate: 16000 });
        }
        if (audioContext.state === "suspended") await audioContext.resume();
        const decoded = await audioContext.decodeAudioData(arrayBuf);
        const pcm = decoded.getChannelData(0);
        segmentSamples = [pcm];
        lastSegment = pcm;
        lastRate = decoded.sampleRate;
        status.textContent = "正在识别测试音频...";
        const chunkSize = 1600;
        for (let i = 0; i < pcm.length; i += chunkSize) {
          const chunk = pcm.subarray(i, Math.min(i + chunkSize, pcm.length));
          session.pushPcm(chunk, decoded.sampleRate);
          paint();
          await new Promise((r) => setTimeout(r, 20));
        }
        await session.drain();
        await session.endSegment();
        paint();
        status.textContent = "测试音频识别完成，可以点击阶段摘要或总结。";
      } catch (err) {
        status.textContent = `测试音频识别失败：${err.message || err}`;
      }
    });

    const externalInput = document.querySelector("#external-input");
    const externalSummary = document.querySelector("#external-summary");
    const summarizeExternalBtn = document.querySelector("#summarize-external");

    summarizeExternalBtn.addEventListener("click", async () => {
      const text = externalInput.value.trim();
      if (!text) {
        externalSummary.textContent = "请先在上方输入需要总结的文本。";
        return;
      }
      externalSummary.textContent = "正在生成外部文本总结...";
      try {
        const result = await session.summarize(text);
        externalSummary.textContent = result || "（无总结结果）";
      } catch (err) {
        if (err?.code === -3) {
          externalSummary.textContent = "Gemma 权重未找到，请先确保模型就绪。";
        } else if (err?.code === -6) {
          externalSummary.textContent = "已有总结正在运行中。";
        } else {
          externalSummary.textContent = `总结失败：${err.message || err}`;
        }
      }
    });
  </script>
</body>
</html>
